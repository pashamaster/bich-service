<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0c0a" />
<title>bich.service</title>
<style>
  html,body{height:100%;margin:0;background:#0d0c0a;color:#e8e2d9;
    font-family:'Geist Mono',ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center}
  p{font-family:'Playfair Display',Georgia,serif;font-style:italic;
    font-size:1.1rem;opacity:.55;letter-spacing:.02em}
</style>
</head>
<body>
  <p>one moment</p>
<script>
/* GitHub Pages has no server side routing, so a share link like
   bich.app/e/xf3k9q2m lands here instead of on the app. Pages serves
   this file for any unknown path, so we hand the path back to the app
   as a query string and let it open the right event.

   replace() rather than assign() keeps this page out of the back
   button history: tapping back from an event should leave the app,
   not bounce through a redirect. */
(function () {
  var p = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');

  /* Two shapes, both valid:
       bich.app/a3f9k      the short link we mint now
       bich.app/e/a3f9k    everything shared before that change

     Anything already out in the world has to keep resolving, so the
     old namespaced form is matched first and never retired. */
  var m = p.match(/^e\/([a-z0-9]{4,32})$/i) || p.match(/^([a-z0-9]{4,32})$/i);

  /* A bare code only. Anything with a dot is a real asset that failed
     to load - config.js, an icon - and redirecting those to the app
     would turn a missing file into a silent blank screen. */
  var code = (m && p.indexOf('.') === -1) ? m[1] : null;

  location.replace((code ? '/?e=' + encodeURIComponent(code) : '/') +
                   location.search.replace(/^\?/, code ? '&' : '?') +
                   location.hash);
})();
</script>
</body>
</html>
