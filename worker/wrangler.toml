name = "bich-app"
main = "worker.js"
compatibility_date = "2026-07-01"

# Custom domain. Cloudflare provisions the certificate and the DNS
# record for this automatically on deploy - do NOT add an api record
# by hand in the DNS tab, it will conflict.
[[routes]]
pattern = "api.bich.app"
custom_domain = true

# Covers live in R2: zero egress cost at any volume.
# ─────────────────────────────────────────────────────────────────────
# Cron. worker.js has had a scheduled() handler since venue
# canonicalisation was added, and Cloudflare NEVER CALLED IT, because a
# scheduled handler without a trigger here is dead code. The comment in
# worker.js calls it "the safety net"; there was no net.
#
# So the only thing driving venue correction was the app's own poke
# after a publish, at limit=3. If that request failed — offline, worker
# cold start, tab closed — nothing ever retried, and the 30 day
# recheck in venues_needing_review() could not happen at all.
#
# Every 15 minutes, limit 20. Overpass is called at most once every
# 1.1s inside the handler, so a full run is ~22s of wall time.
# ─────────────────────────────────────────────────────────────────────
[triggers]
crons = ["*/15 * * * *"]

[[r2_buckets]]
binding = "COVERS"
bucket_name = "bich-covers"

# ─────────────────────────────────────────────────────────────────────
# KV. Three separate things depend on this:
#   · passkey challenges and credentials  (routes return 503 without it)
#   · the reverse-geocode cache           (falls back to hitting OSM
#     every single time, which their rate limit will not tolerate)
#   · the daily Gemini spend cap
#
# ⚠️  REPLACE THE id BELOW. Run this first:
#        npx wrangler kv namespace create BICH_KV
#     then paste the id it prints over PASTE_YOUR_ID_HERE.
#     Deploying with the placeholder still there will fail.
# ─────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "BICH_KV"
id = "b70349f207d04dcc916055cf299ea329"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Only the real app may call this worker. A stolen invite code is
# useless from anywhere else.
ALLOWED_ORIGINS = "https://bich.app,https://www.bich.app"

# Covers served straight from R2's own custom domain: no worker
# invocation per image, and the edge cache does the work.
# If img.bich.app is NOT attached to the bucket in R2 > Settings >
# Custom Domains, delete this line entirely. The worker then serves
# images itself, which always works. A wrong value is worse than none,
# because the fallback only applies when this is unset.
PUBLIC_IMG_BASE = "https://img.bich.app"

# Empty = open. Add comma separated codes to gate the photo feature.
BICH_INVITE_CODES = ""

# Hard ceiling on Gemini calls per day, counted in KV. This is the real
# spend protection - the first-100-users rule is a product decision and
# a cleared browser walks straight through it.
DAILY_CAP = "180"

# Magic access is a flag on the account now, not a number here. Grant
# it in Supabase:
#   update public.users set magic_enabled = true where handle = 'pine tem';
# or hand somebody a code from public.magic_codes, which they redeem in
# the app once and keep permanently.

# Needed for the cohort check. This is the SAME anon key the browser
# already holds and publishes in config.js, so nothing new is trusted
# to this worker - row level security is what protects the data, not
# the secrecy of this string. There is still no service-role key here.
SUPABASE_URL = "https://omwurzkxapktduzppbim.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9td3Vyemt4YXBrdGR1enBwYmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NTUyMDMsImV4cCI6MjEwMTEzMTIwM30.w4VJNgbcNNDZqL9TAtfByduwwYBZfI4mpEmwANyLCxA"

# The core/magic wall. "false" makes /extract-event return 404 and no
# request can reach Gemini at all.
#
# This is now "true" because config.js has magic.enabled = true. BOTH
# switches must agree: with only the browser one on, the magic button
# appears, arms, and then every photo fails with a 404.
MAGIC_ENABLED = "true"

# Passkeys. The RP id must be the apex domain and must NEVER change:
# every passkey ever created is cryptographically bound to it, and
# editing this orphans all of them with no way back.
WEBAUTHN_RP_ID = "bich.app"
WEBAUTHN_RP_NAME = "bich.service"

# ─────────────────────────────────────────────────────────────────────
# Secrets are NOT in this file and must never be. They are encrypted on
# Cloudflare's side and survive every deploy, so you set them once:
#
#   npx wrangler secret put GEMINI_API_KEY
#
# There is deliberately no Supabase key of any kind here. The worker
# cannot read or write your database, and that is the design.
# ─────────────────────────────────────────────────────────────────────
